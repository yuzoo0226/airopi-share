# =============================================================================
#  ROS 2 (Humble) deployment stack for AiroPi / HSR
#
#    hsr-sim        : Ignition Gazebo Fortress HSR simulator + the ROS 2
#                     openpi client node (ROS 2 Humble, Python 3.10)
#    openpi-server  : pi0 / pi0.5 policy served over a websocket
#                     (Python 3.11 + JAX, decoupled from ROS)
#
#  Host paths are configurable through the variables below; the defaults assume
#  the layout produced by scripts/setup_hsr_ros2_ws.sh:
#
#    <workspace root>/airopi-share     <- this repository
#    <workspace root>/hsr_ros2_ws      <- HSR ROS 2 simulator workspace
#    <workspace root>/checkpoints      <- downloaded openpi checkpoints
# =============================================================================
services:
  hsr-sim:
    image: hsr-ros2-sim:humble
    container_name: ${HSR_SIM_CONTAINER:-hsr-ros2-sim}
    build:
      context: .
      dockerfile: Dockerfile.sim
      args:
        USER_UID: ${HOST_UID:-1000}
        USER_GID: ${HOST_GID:-1000}
    network_mode: host
    ipc: host
    pid: host
    privileged: true
    runtime: ${DOCKER_RUNTIME:-nvidia}
    stdin_open: true
    tty: true
    environment:
      - DISPLAY=${DISPLAY:-}
      - QT_X11_NO_MITSHM=1
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=all
      - ROS_DOMAIN_ID=${ROS_DOMAIN_ID:-42}
      - RMW_IMPLEMENTATION=${RMW_IMPLEMENTATION:-rmw_fastrtps_cpp}
      - AIROPI_REPO=/home/hsr/airopi-share
    volumes:
      - ${HSR_ROS2_WS:-../../../hsr_ros2_ws}:/home/hsr/hsr_ros2_ws
      - ${AIROPI_REPO_DIR:-../..}:/home/hsr/airopi-share
      - ${CHECKPOINT_DIR:-../../../checkpoints}:/home/hsr/checkpoints:ro
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - /dev/dri:/dev/dri
    working_dir: /home/hsr/hsr_ros2_ws
    command: ["sleep", "infinity"]

  openpi-server:
    image: airopi-server:arm64
    container_name: ${OPENPI_SERVER_CONTAINER:-airopi-policy-server}
    build:
      context: ../..
      dockerfile: docker/ros2/Dockerfile.server
    network_mode: host
    ipc: host
    runtime: ${DOCKER_RUNTIME:-nvidia}
    stdin_open: true
    tty: true
    shm_size: "8gb"
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
      - POLICY_CHECKPOINT_DIR=${POLICY_CHECKPOINT_DIR:-/home/openpi/checkpoints/airoa-pi05-hsr-base}
      - POLICY_SERVER_HOST=${POLICY_SERVER_HOST:-0.0.0.0}
      - POLICY_SERVER_PORT=${POLICY_SERVER_PORT:-8000}
      - POLICY_DEFAULT_PROMPT=${POLICY_DEFAULT_PROMPT:-Grasp the bottle.}
      - JAX_PLATFORMS=${JAX_PLATFORMS:-}
      - XLA_PYTHON_CLIENT_PREALLOCATE=false
      - XLA_PYTHON_CLIENT_MEM_FRACTION=${XLA_PYTHON_CLIENT_MEM_FRACTION:-0.4}
    volumes:
      - ${AIROPI_REPO_DIR:-../..}:/home/openpi
      - ${CHECKPOINT_DIR:-../../../checkpoints}:/home/openpi/checkpoints:ro
      - ${OPENPI_CACHE_DIR:-../../../.cache_openpi}:/home/openpi/.cache
    working_dir: /home/openpi
