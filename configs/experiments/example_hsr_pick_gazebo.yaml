# Fine-tune pi0.5 on the scripted pick demonstrations collected in the ROS 2 /
# Ignition Gazebo HSR simulator.
#
#   ros2 launch hsr_openpi collect_data.launch.py driver:=pick num_episodes:=100
#   deploy/hsr_openpi_ros2/tools/rosbag2_to_lerobot.py --bag ... --image-order bgr
#   scripts/aggregate_stats_fast.py --action-column action.relative --action-mode relative
#   scripts/train.py --config-yaml configs/experiments/example_hsr_pick_gazebo.yaml
#
# Budget in *steps*, not epochs. Measured on this GB10: 5.8 s/step at batch 16,
# so an epoch of the 26,042-frame dataset (1,628 steps) costs 2.6 hours and the
# "10 / 50 / 100 epochs" the task was originally phrased in would be 26 hours,
# 5.5 days and 11 days. The three evaluation points below are 10k / 20k / 30k
# steps instead: 16, 32 and 48 hours, i.e. ~6, ~12 and ~18 epochs.
experiment:
  name: example_hsr_pick_gazebo
  project_name: openpi
  seed: 42
  wandb_enabled: false

dataset:
  repo_id: lerobot_datasets/hsr_gazebo_pick
  data_dir: /home/datasets/lerobot_datasets/hsr_gazebo_pick
  assets_dir: ./assets/example_hsr_pick_gazebo
  asset_id: lerobot_datasets/hsr_gazebo_pick
  prompt_from_task: true
  action_mode: relative
  fast_lerobot: true
  lerobot_backend: parquet
  lerobot_checks: none
  video_backend: torchcodec
  adapt_to_pi: true
  convert_gripper: false
  base_action_dim: 3

model:
  type: pi05
  # MUST match the released checkpoint. pi0 names the image encoders
  #   shared   : every image key -> "img"
  #   per_image: IMAGE_KEYS[0] -> "img", the others -> "img_<key>"
  # airoa-pi05-hsr-base was trained with per_image, so loading it into a
  # "shared" model silently keeps only the encoder behind IMAGE_KEYS[0] -
  # which for HSR is the all-zero, masked-out base_0_rgb slot, i.e. essentially
  # untouched PaliGemma weights - and drops the HSR-adapted hand/head encoders.
  image_encoder_mode: per_image
  paligemma_variant: gemma_2b
  action_expert_variant: gemma_300m
  action_dim: 32
  action_horizon: 16
  finetune_recipe:
    freeze_text_tower: true
    train_action_expert: true
    train_action_head: true
    vision_lora:
      enabled: true
      rank: 16
      alpha: 16.0
      targets: [patch_embedding, attention, mlp, head]

training:
  # Measured on the GB10 (one GPU, unified memory): ~2.8 samples/s, i.e. 5.7 s
  # per step at batch 16 and 1.7 s at batch 4 - compute bound, not data bound
  # (8 dataloader workers change nothing and the 591 MB dataset is page cached).
  # 26042 frames / 16 = 1628 steps per epoch, so one epoch takes ~2.6 hours.
  batch_size: 16
  num_workers: 8
  pin_memory: true
  prefetch_factor: 4
  num_train_steps: 30000      # ~18 epochs, 48 h
  val_split_fraction: 0.05
  val_split_seed: 42
  eval_interval: 1000
  eval_num_batches: 4
  eval_num_sample_steps: 10
  # The checkpoint at step 1000 is the A/B against the previous run, which
  # scored 1/19 closed loop after 966 steps on 74 fixed-head episodes.
  save_interval: 1000
  keep_period: 10000          # keep the three evaluation points permanently
  log_interval: 50
  lr_schedule:
    type: cosine_decay
    warmup_steps: 1000
    peak_lr: 5.0e-5
    decay_steps: 30000
    decay_lr: 5.0e-6

gpu:
  num_gpus: 1
  base_gpus: 1
  fsdp_devices: 1

scaling:
  base_batch_size: 16
  scale_batch_size: false
  scale_learning_rate: false
  scale_train_steps: false
  workers_per_gpu: 1

task_sampler:
  kind: uniform
  alpha: 1.0
  ema_decay: 0.9
  min_prob: 0.0
  eps: 1.0e-6

weight_loader:
  type: checkpoint
  # /home/checkpoints comes from docker/ros2/docker-compose.train.yml
  params_path: /home/checkpoints/airoa-pi05-hsr-base/params

checkpoints:
  base_model:
    pi05: gs://openpi-assets/checkpoints/pi05_base/params
