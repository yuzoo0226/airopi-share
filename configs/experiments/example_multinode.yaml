_base_: example_base.yaml

experiment:
  name: example_multinode

gpu:
  num_gpus: 64  # 8 nodes x 8 GPUs
  base_gpus: 64
  fsdp_devices: 1

scaling:
  scale_batch_size: false
  scale_learning_rate: false
  scale_train_steps: false
  workers_per_gpu: 1

training:
  num_train_steps: 1200000
  lr_schedule:
    type: cosine_decay
    warmup_steps: 1000
    peak_lr: 3.5e-5
    decay_steps: 1200000
    decay_lr: 3.5e-6
